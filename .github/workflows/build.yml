name: Build ComboKeys

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.5'

  - name: Build mod
    run: gradle build

  - name: Upload mod
    uses: actions/upload-artifact@v4
    with:
      name: ComboKeys-1.18.2
      path: build/libs/*.jar
      if-no-files-found: error
